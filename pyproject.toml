[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "duckdb-iceberg-mcp"
version = "0.1.0"
description = "MCP server for querying Apache Iceberg tables via AWS Glue using DuckDB"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Yee Soon", email = "yee.soon@core0.io" },
]
dependencies = [
    "mcp[cli]>=1.9",
    "duckdb>=1.2",
    "sqlglot>=25.0",
    "pydantic-settings>=2.6",
    "PyJWT[crypto]>=2.10",
    "httpx>=0.27",
    "boto3>=1.34",
    "uvicorn>=0.32",
    "starlette>=0.41",
    "pandas>=2.0",
    "fastavro>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
duckdb-iceberg-mcp = "duckdb_iceberg_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/duckdb_iceberg_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
